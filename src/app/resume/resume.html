<section class="resume-page">
  <div class="section-head">
    <span class="num">CV</span>
    <h2>My<br>resume</h2>
  </div>

  <div class="resume-grid">
    <div class="resume-sheet reveal">
      <img [src]="preview" alt="Preview of Ed Castillo's resume">
    </div>

    <aside class="resume-side reveal">
      <div class="file-card">
        <p><span>File</span> {{ downloadName }}</p>
        <p><span>Status</span> Ready to download</p>
      </div>

      <a class="btn big" [href]="file" [attr.download]="downloadName">Download CV ↓</a>

      <p class="resume-note">Want to talk about it? <a href="mailto:castilloed7899@gmail.com">castilloed7899&#64;gmail.com</a></p>
    </aside>
  </div>
</section>
