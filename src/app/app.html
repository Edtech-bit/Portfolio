<div class="portfolio-wrapper">
  <nav class="navbar" aria-label="Main">
    <a class="nav-brand" routerLink="/" aria-label="Go to home">
      <img src="EdLogo.png" alt="" class="nav-logo">
      <span class="logo-text">Ed <span class="accent">Castillo</span></span>
    </a>

    <div class="nav-links">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}">index</a>
      <a routerLink="/projects" routerLinkActive="active">work</a>
      <a routerLink="/about" routerLinkActive="active">about</a>
      <a routerLink="/resume" routerLinkActive="active">cv</a>
      <a routerLink="/contact" routerLinkActive="active">reach</a>
    </div>

    <button type="button" class="theme-toggle" (click)="toggleTheme()"
            [attr.aria-label]="isLightMode ? 'Switch to dark mode' : 'Switch to light mode'">
      @if (isLightMode) {
  <!-- Moon icon (shown in light mode) -->
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
       stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
  </svg>
} @else {
  <!-- Sun icon (shown in dark mode) -->
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
       stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <circle cx="12" cy="12" r="4"/>
    <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
  </svg>
}
    </button>
