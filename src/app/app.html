<header class="topbar">
  <a class="brand" routerLink="/" aria-label="Ed Castillo, home" (click)="closeMenu()">
    <img src="EdLogo.png" alt="" class="brand-logo">
    <span class="brand-name">ED CASTILLO</span>
  </a>

  <nav class="menu" id="main-menu" [class.open]="menuOpen" aria-label="Main">
    <a routerLink="/projects" routerLinkActive="active" (click)="closeMenu()">Work</a>
    <a routerLink="/" fragment="about" (click)="closeMenu()">About</a>
    <a routerLink="/resume" routerLinkActive="active" (click)="closeMenu()">CV</a>
    <a routerLink="/" fragment="contact" (click)="closeMenu()">Contact</a>
  </nav>

  <div class="bar-buttons">
    <button type="button" class="theme-toggle" (click)="toggleTheme()"
            [attr.aria-label]="isDark ? 'Switch to light mode' : 'Switch to dark mode'">
      @if (isDark) {
        <!-- Sun (click to go light) -->
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
        </svg>
      } @else {
        <!-- Moon (click to go dark) -->
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
        </svg>
      }
    </button>

    <!-- Hamburger button (only shows on phones) -->
    <button type="button" class="burger" [class.open]="menuOpen" (click)="toggleMenu()"
            [attr.aria-expanded]="menuOpen" aria-controls="main-menu"
            [attr.aria-label]="menuOpen ? 'Close menu' : 'Open menu'">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </div>
</header>

<!-- Dark area behind the phone menu. Tap it to close the menu. -->
@if (menuOpen) {
  <div class="backdrop" (click)="closeMenu()"></div>
}

<main class="page-content">
  <router-outlet></router-outlet>
</main>
