<div class="portfolio-wrapper">
  <nav class="navbar">
    <div class="nav-brand">
      <img src="EdLogo.png" alt="Logo" class="nav-logo">
      <div class="logo-text">Ed <span class="accent">Castillo</span></div>
      </div>

    <div class="nav-links">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}">index</a>
      <a routerLink="/projects" routerLinkActive="active">work</a>
      <a routerLink="/about" routerLinkActive="active">about</a>
      <a routerLink="/resume" routerLinkActive="active">cv</a>
      <a routerLink="/contact" routerLinkActive="active">reach</a>
    </div>

    <div class="theme-toggle" (click)="toggleTheme()" role="button" aria-label="Toggle Theme">
      {{ isLightMode ? '🌙' : '☀️' }}
    </div>
  </nav>

  <main class="page-content">
    <router-outlet></router-outlet>
  </main>

  <footer class="footer">
    <p>// 2026 EDITION</p>
    <div class="footer-socials">
      <i class="fab fa-facebook"></i>
      <i class="fab fa-x-twitter"></i>
      <i class="fab fa-linkedin"></i>
      <i class="fab fa-instagram"></i>
      <i class="fab fa-figma"></i>
    </div>
  </footer>
</div>
